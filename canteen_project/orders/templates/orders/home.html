<!DOCTYPE html>
<html>
<head>
    <title>College Canteen - Food Order Tracker</title>
    <style>
        table {
            border-collapse: collapse;
            width: 70%;
        }
        th, td {
            border: 1px solid #333;
            padding: 8px 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>College Canteen - Food Order Tracker</h1>
    <h2>Food Orders</h2>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Food Item</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            {% for order in orders %}
            <tr>
               <td>{{ order.customer_name }}</td>
                <td>{{ order.food_item }}</td>
                <td>{{ order.quantity }}</td>
                <td>₹{{ order.price }}</td>
                <td>{% if order.is_delivered %}Delivered{% else %}Not Delivered{% endif %}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
